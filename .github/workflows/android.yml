name: Build Android APK
on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build unsigned release
        shell: bash
        run: |
          gradle testDebugUnitTest lintDebug lintRelease assembleRelease --stacktrace
      - name: Validate and package unsigned release
        id: unsigned-package
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          reports=app/build/reports
          mkdir -p "$reports"
          test -f "$apk"
          if find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name 'app-release-unsigned.apk' -print -quit | grep -q .; then
            echo '::error::Unexpected signed release APK. Cloud signing is not allowed.'
            exit 1
          fi
          "$sdk_tools/aapt2" dump badging "$apk" > "$reports/apk-badging.txt"
          if "$sdk_tools/apksigner" verify --verbose --print-certs "$apk" > "$reports/apksigner-unsigned-check.txt" 2>&1; then
            echo '::error::The cloud release APK is signed. Only an unsigned APK may be delivered.'
            exit 1
          fi
          python3 - "$apk" "$reports" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys
          import zipfile

          apk_path = pathlib.Path(sys.argv[1])
          reports = pathlib.Path(sys.argv[2])
          source = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          versions = re.findall(r"(?m)^\s*versionCode\s*=\s*(\d+)\s*$", source)
          if len(versions) != 1:
              raise SystemExit("Expected exactly one numeric versionCode in source")
          badging = (reports / "apk-badging.txt").read_text(encoding="utf-8")
          package = re.search(r"(?m)^package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'", badging)
          if not package or package.group(1) != "cn.baoxiao.ledger" or package.group(2) != versions[0]:
              raise SystemExit("APK package name or versionCode does not match the source")
          with apk_path.open("rb") as apk_file, zipfile.ZipFile(apk_file) as archive:
              if any(re.fullmatch(r"META-INF/[^/]+\.(RSA|DSA|EC|SF)", name, re.IGNORECASE) for name in archive.namelist()):
                  raise SystemExit("Unexpected JAR signature metadata in unsigned APK")
              apk_file.seek(max(0, archive.start_dir - 16))
              if apk_file.read(16) == b"APK Sig Block 42":
                  raise SystemExit("Unexpected APK signing block in unsigned APK")
          (reports / "unsigned-validation.txt").write_text(
              f"Package: {package.group(1)}\nVersion code: {versions[0]}\n"
              "No JAR signatures or APK signing block found.\n",
              encoding="utf-8",
          )
          unsigned_delivery = pathlib.Path("delivery/Unsigned")
          unsigned_delivery.mkdir(parents=True, exist_ok=True)
          (unsigned_delivery / "build-info.json").write_text(
              json.dumps({
                  "packageName": package.group(1),
                  "versionCode": int(package.group(2)),
                  "versionName": package.group(3),
                  "unsignedApkSha256": hashlib.sha256(apk_path.read_bytes()).hexdigest(),
                  "sourceCommit": os.environ["GITHUB_SHA"],
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          "$sdk_tools/zipalign" -c -P 16 -v 4 "$apk" > "$reports/zipalign.txt"
          mkdir -p delivery/Unsigned delivery/tools delivery/reports
          cp "$apk" delivery/Unsigned/app-release-unsigned.apk
          cp "$sdk_tools/lib/apksigner.jar" delivery/tools/apksigner.jar
          cp "$reports"/{apk-badging.txt,apksigner-unsigned-check.txt,unsigned-validation.txt,zipalign.txt} delivery/reports/
          (
            cd delivery
            sha256sum Unsigned/app-release-unsigned.apk Unsigned/build-info.json tools/apksigner.jar > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ success() && steps.unsigned-package.outputs.verified == 'true' }}
        with:
          name: BaoXiao-unsigned
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/
